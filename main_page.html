<!doctype html>
<html>
    <body>
        <h1>Upload GitHub repo or project files</h1>
        <input type = "url" id = "url" placeholder="https://github.com/user/repo">
        <input type="file" name="files" multiple webkitdirectory>
        <button onclick="upload()">Check</button>
        <pre id="result"></pre>

        <script>
            async function upload(){
                const link = document.getElementById("link").value.trim();
                const files = document.getElementbyId("files").files;
                const result = document.getElementbyId("result");

                if (!link && files.length == 0) {
                   result.textContent = "Add a GitHub link or choose project files."
                   return; 
                }

                const form = new FormData();
                if(link){
                    const m = link.match(/^https:\/\/github\.com\/([\w.-]+)\/([\w.-]+?)(\.git)?\/?$/);
                    if (!m) {
                        result.textContet = "Please only use Github repo links"
                        return;
                    }
                    form.append("repo", `${m[1]}/${m[2]}`);
                }
                for (const f of files){
                    form.append("files", f, f.webkitRelativePath || f.name);
                }

                const res = await fetch("/api/sbom", { method: "POST", body: form});
                result.textContent = await res.text();
            }
        </script>
    </body>
</html>
