services:
  postgres:
    image: postgres:16
    container_name: sbom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
 
  redis:
    image: redis:7
    container_name: sbom-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    image: python:3.12
    container_name: sbom-api
    working_dir: /app
    command: sh -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 5000"
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - .:/app
      - scan-uploads:/tmp/banana-chain-scans
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      redis:
        condition: service_healthy

  celery_worker:
    image: python:3.12
    container_name: sbom-celery-worker
    working_dir: /app
    command: sh -c "pip install -r requirements.txt && celery -A app.workers.celery_app.celery_app worker --loglevel=info"
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - .:/app
      - scan-uploads:/tmp/banana-chain-scans
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    image: node:24
    container_name: sbom-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      # Target for the Vite /health proxy; add depends_on: [api] once the api service exists
      API_URL: http://api:5000
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      # Keep the container's Linux node_modules separate from the host's
      - /app/node_modules

volumes:
  postgres-data:
  scan-uploads:
